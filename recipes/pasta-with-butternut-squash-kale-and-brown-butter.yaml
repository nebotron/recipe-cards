title: Pasta With Butternut Squash, Kale and Brown Butter
yield: 4 servings
source: https://cooking.nytimes.com/recipes/1023461
notes:
  - By Ali Slagle for NYT Cooking. Total time 30 minutes.
  - The squash is browned in two batches in a single layer, each with half the oil and a pinch of salt. If there isn't room for the second batch, set the first aside on a plate and return it before adding the butter.
  - If you're using a dark pot, spoon some butter onto the squash to check that it's speckled brown.
  - "Substitutions: another nutty spice for the garam masala (five spice, turmeric with chile powder, or cinnamon with crushed fennel seeds); regular pasta for whole-wheat; chickpeas or carrot for the squash; brussels sprouts, broccolini or mature spinach for the kale."

recipe:
  step: serve
  inputs:
    - step: season to taste
      inputs:
        - step: remove from heat; stir in
          inputs:
            - step: toss over low heat until glossy
              detail: with 1/2 cup reserved pasta water; add more if dry
              inputs:
                - step: toss gently; set aside
                  inputs:
                    - step: turn off heat; stir until fragrant, ~1 min.
                      inputs:
                        - step: medium-low 1–4 min.
                          detail: stir until butter is golden, nutty and foaming
                          inputs:
                            - step: brown over medium-high 3–5 min. per batch
                              detail: 2 batches, single layer, undisturbed
                              inputs:
                                - { amount: 1 Tbs., ingredient: neutral oil (canola or grapeseed) }
                                - { amount: 1 to 1-1/2 lb., ingredient: "butternut, honeynut, acorn or delicata squash", prep: "peeled if desired, halved, seeded, sliced 1/4-inch thick crosswise" }
                                - { ingredient: kosher salt, prep: to taste }
                            - { amount: 6 Tbs., ingredient: unsalted butter, prep: sliced }
                        - { amount: 1-1/4 tsp., ingredient: garam masala }
                        - { amount: 1/2 tsp., ingredient: red-pepper flakes }
                    - { amount: 1 Tbs., ingredient: cold water (or an ice cube) }
                - step: drain
                  detail: reserve 1 cup pasta water
                  inputs:
                    - step: add for last 3 min.
                      inputs:
                        - step: cook until al dente
                          detail: per package directions
                          inputs:
                            - step: bring to a boil
                              inputs:
                                - { ingredient: kosher salt }
                                - { ingredient: water, prep: large pot }
                            - { amount: 1 lb., ingredient: whole-wheat spaghetti or linguine }
                        - { amount: 1 bunch, ingredient: Tuscan kale, prep: "ribs removed, leaves torn or coarsely chopped" }
            - { amount: 1 tsp., ingredient: lemon zest, prep: finely grated }
            - { amount: 2 Tbs., ingredient: lemon juice (from 1 lemon) }
        - { ingredient: lemon juice, prep: to taste }
        - { ingredient: red-pepper flakes, prep: to taste }
        - { ingredient: kosher salt, prep: to taste }
    - { ingredient: Parmesan, prep: grated }
