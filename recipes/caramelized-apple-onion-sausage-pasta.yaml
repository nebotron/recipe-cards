title: Caramelized Apple, Onion & Sausage Pasta
active_time: 55 minutes
total_time: 55 minutes
serves: 6

ingredients:
  - quantity: 1 Tbsp.
    item: olive oil
  - quantity: 1 16-oz. pkg.
    item: bulk pork sausage
  - quantity: 1/4 cup (1/2 stick)
    item: unsalted butter
  - quantity: 6 cups
    item: sliced red onions
    note: from 3 onions
  - quantity: 3 cups
    item: 1/4-in. pieces Granny Smith, Golden Delicious, or Honeycrisp apples
    note: from 2 apples
  - quantity: 2 tsp.
    item: kosher salt
    note: divided, plus more for cooking pasta
  - quantity: 1 16-oz. pkg.
    item: campanelle or penne pasta
  - quantity: 3 cloves
    item: garlic
    note: finely chopped (about 1 Tbsp.)
  - quantity: 2 tsp.
    item: finely chopped fresh thyme
    note: plus more for garnish
  - quantity: 3/4 cup
    item: chicken broth
  - quantity: 1/2 cup
    item: finely grated Parmesan cheese
    note: plus more for garnish
  - quantity: 2 tsp.
    item: apple cider vinegar
  - quantity: 1/2 tsp.
    item: freshly ground black pepper

steps:
  - >-
    Heat oil in a large pot or Dutch oven over medium-high. Add sausage; cook,
    stirring occasionally to break into small pieces, until browned and cooked
    through, 6 to 10 minutes. Transfer to a plate with a slotted spoon.
  - >-
    Reduce heat to medium. Add butter to pot; cook, stirring, until melted,
    about 1 minute. Add onions, apples, and 1/2 teaspoon salt; cook, stirring
    occasionally, until apples are softened and onions are caramelized, about
    30 minutes. Add water as needed, 2 to 4 tablespoons at a time, to deglaze
    skillet and prevent browned bits from burning.
  - >-
    Meanwhile, bring a large pot of salted water to a boil. Cook pasta for
    1 minute less than package directions for al dente. Drain, reserving 1 cup
    cooking water.
  - >-
    Once onions are caramelized, add garlic and thyme; cook, stirring often,
    until softened, about 1 minute.
  - >-
    Add cooked pasta, sausage, broth, cheese, vinegar, pepper, 1/4 cup reserved
    cooking water, and remaining 1 1/2 teaspoons salt to pot. Cook, stirring,
    until cheese is melted and pasta is lightly coated, 2 to 3 minutes. If
    needed, add remaining 3/4 cup cooking water, 1/4 cup at a time, to reach
    desired sauce consistency. Top with thyme and cheese.
