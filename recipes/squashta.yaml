title: Squashta
yield: 3 decent servings or 2 hungry servings
source: Jordie

recipe:
  step: mix
  inputs:
    - step: mix
      detail: with a bit more pasta water
      inputs:
        - step: mix
          inputs:
            - step: turn heat down
              detail: until the pasta is ready
              inputs:
                - step: cook a couple min. until fragrant
                  detail: in a space cleared in the middle of the pan
                  inputs:
                    - step: cook a couple min. until translucent
                      detail: in a space cleared in the middle of the pan
                      inputs:
                        - step: sauté until squash browns a bit
                          detail: in a large pot
                          inputs:
                            - { amount: 2 Tbs., ingredient: olive oil, info: can use half butter }
                            - { amount: 2-4, ingredient: squashes, prep: sliced thin }
                            - { ingredient: black pepper }
                            - { ingredient: chili flakes }
                            - { ingredient: salt, info: "Ideally ~60% celery salt / 40% MSG, but any salt works fine." }
                        - { ingredient: salt }
                        - { amount: 1, ingredient: shallot }
                    - { amount: 2 cloves, ingredient: garlic }
                    - { ingredient: white pepper }
                    - { ingredient: "oregano, thyme, tarragon and/or rosemary", info: Dealer's choice. Fresh herbs work too. }
            - step: drain
              detail: reserve plenty of pasta water
              inputs:
                - step: cook to 1 min. short of al dente
                  inputs:
                    - { amount: 1 lb., ingredient: protein pasta }
        - { amount: 2/3 cup, ingredient: Parmesan and/or pecorino, prep: grated }
        - { ingredient: Italian flat-leaf parsley, prep: optional }
    - { ingredient: zest of 1 lemon }
    - { amount: 1/2 lemon, ingredient: juice }
