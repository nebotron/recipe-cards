title: Pumpkin Cheesecake with Caramel Swirl
yield: 10 servings
source: Teresa Dion
info: The caramel sauce and the caramel swirl steps are crossed out on the original card, so they are left out here.

recipe:
  step: release pan sides
  inputs:
    - step: spread topping evenly
      detail: can be made 1 day ahead; cover and refrigerate
      inputs:
        - step: press edges down to even thickness
          inputs:
            - step: cool; cover and refrigerate overnight
              inputs:
                - step: cool on rack 10 min.
                  detail: run a small sharp knife around pan sides to loosen
                  inputs:
                    - step: 350°F for about 1 hr. 15 min.
                      detail: until puffed, top browns, and center moves only slightly when pan is shaken
                      inputs:
                        - step: pour filling into crust
                          detail: filling will almost fill pan
                          inputs:
                            - step: press onto bottom and up sides of pan
                              detail: 9-inch springform pan with 2-3/4-inch-high sides
                              inputs:
                                - step: blend until combined
                                  inputs:
                                    - step: grind finely in processor
                                      inputs:
                                        - { amount: 1-1/2 cup, ingredient: gingersnap cookies, prep: ground }
                                        - { amount: 1-1/2 cup, ingredient: pecans, prep: toasted (about 6 oz.) }
                                        - { amount: 1/4 cup, ingredient: brown sugar, prep: firmly packed }
                                    - { amount: 1/4 cup (1/2 stick), ingredient: unsalted butter, prep: melted }
                            - step: add 1 at a time
                              detail: beat just until combined
                              inputs:
                                - { amount: 4, ingredient: large eggs }
                                - step: beat until well combined
                                  inputs:
                                    - step: beat with electric mixer until light
                                      detail: reserve 3/4 cup for topping; cover tightly and refrigerate
                                      inputs:
                                        - { amount: 4 8-oz. packages, ingredient: cream cheese, prep: room temperature }
                                        - { amount: 1-1/3 cup, ingredient: sugar }
                                    - { amount: 1-1/2 cup, ingredient: canned solid pack pumpkin }
                                    - { amount: 1 tsp., ingredient: ground cinnamon }
                                    - { amount: 1 tsp., ingredient: ground allspice, prep: "or 1/2 tsp. each ground cloves, ginger, and nutmeg" }
                                    - { amount: 4 Tbs., ingredient: whipping cream, info: "The recipe uses 9 Tbs. whipping cream in all: 4 Tbs. in the filling and 5 Tbs. in the topping." }
        - step: stir to combine
          inputs:
            - { amount: 5 Tbs., ingredient: whipping cream, info: "The recipe uses 9 Tbs. whipping cream in all: 4 Tbs. in the filling and 5 Tbs. in the topping." }
            - { amount: 3/4 cup, ingredient: reserved cream cheese mixture, prep: brought to room temperature, info: "3/4 cup of the beaten cream cheese and sugar, set aside and chilled before the pumpkin goes in." }
