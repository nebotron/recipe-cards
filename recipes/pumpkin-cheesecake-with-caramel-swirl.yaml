title: Pumpkin Cheesecake with Caramel Swirl
yield: 10 servings
source: Teresa Dion
info: The caramel sauce and the caramel swirl steps are crossed out on the original card, so they are left out here.

recipe:
  step: apply frosting
  inputs:
    - step: cover and refrigerate overnight
      inputs:
        - step: cool on rack 60 min.
          detail: run a small sharp knife around pan sides to loosen
          inputs:
            - step: 350°F for about 1 hr. 15 min.
              detail: until puffed, top browns, and center moves only slightly when pan is shaken
              inputs:
                - step: pour filling into crust
                  inputs:
                    - step: press onto bottom and up sides of pan
                      detail: 9-inch springform pan with 2-3/4-inch-high sides
                      inputs:
                        - step: blend until combined
                          inputs:
                            - step: grind in food processor
                              inputs:
                                - { amount: 1-1/2 cup, ingredient: gingersnap cookies }
                                - step: toast
                                  inputs:
                                    - { amount: 1-1/2 cup, ingredient: pecans }
                                - { amount: 1/4 cup, ingredient: packed brown sugar }
                            - step: melt
                              inputs:
                                - { amount: 1/4 cup (1/2 stick), ingredient: unsalted butter }
                    - step: mix until just combined
                      inputs:
                        - { amount: 4, ingredient: large eggs }
                        - step: mix
                          inputs:
                            - step: beat with electric mixer until light
                              detail: reserve 3/4 cup for topping; cover tightly and refrigerate
                              inputs:
                                - { amount: 4 8-oz. packages, ingredient: cream cheese, prep: room temperature }
                                - { amount: 1-1/3 cup, ingredient: sugar }
                            - { amount: 1-1/2 cup, ingredient: canned solid pack pumpkin }
                            - { amount: 1 tsp., ingredient: ground cinnamon }
                            - { amount: 1 tsp., ingredient: ground allspice, prep: "or 1/2 tsp. each ground cloves, ginger, and nutmeg" }
                            - { amount: 4 Tbs., ingredient: whipping cream }
    - step: mix
      inputs:
        - { amount: 5 Tbs., ingredient: whipping cream }
        - { amount: 3/4 cup, ingredient: reserved cream cheese mixture, prep: brought to room temperature }
