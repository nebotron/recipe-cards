title: Oatmeal Raisin Cookies
yield: 14 cookies
source: https://www.seriouseats.com/oatmeal-raisin-cookies-recipe-8759166
info: Developed by Nicole Hopper for Serious Eats. Total time 4 hrs., mostly chilling and cooling. Baked cookies keep in an airtight container at room temperature for up to 5 days.

recipe:
  step: cool on a wire rack ~45 min.
  inputs:
    - step: cool on sheet 15 min.
      info: The cookies are very delicate out of the oven; letting them set on the sheet keeps them from breaking.
      inputs:
        - step: 350°F for 12–14 min.
          detail: one sheet at a time, until edges are golden and centers soft and pale
          info: Bang the pan on the counter right after it comes out. For neater cookies, swirl a 4-1/2-inch ring cutter or small bowl around each one while warm.
          inputs:
            - step: flatten into 1-inch-tall discs
              detail: 2 in. apart on two parchment-lined sheets
              inputs:
                - step: chill 1 hr.
                  info: Portioned dough can be frozen up to 3 months (freeze on a sheet, then bag). Bake from frozen, about 15 min.
                  inputs:
                    - step: scoop 2-oz. portions
                      detail: "#16 scoop or 1/4 cup; about 72 g each"
                      info: For smaller cookies, use a 2 Tbs. scoop and bake 8–10 min.
                      inputs:
                        - step: cover and chill ~1 hr.
                          detail: until firm enough to scoop
                          inputs:
                            - step: fold in until no flour streaks remain
                              inputs:
                                - step: fold together until mostly combined
                                  detail: rubber spatula
                                  inputs:
                                    - step: whisk in one at a time
                                      detail: until thick, smooth and shiny
                                      inputs:
                                        - step: whisk until smooth
                                          inputs:
                                            - step: cool ~10 min.
                                              inputs:
                                                - step: stir in
                                                  detail: off heat, in a large heatproof bowl
                                                  inputs:
                                                    - step: brown over medium heat 6–8 min.
                                                      detail: stirring often, until solids are golden and nutty
                                                      info: Pour the butter and all the toasted bits into the bowl right away.
                                                      inputs:
                                                        - { amount: 226 g (8 oz.; 2 sticks), ingredient: unsalted butter }
                                                    - { amount: 1 tsp., ingredient: ground cinnamon }
                                                    - { amount: 1/4 tsp., ingredient: nutmeg, prep: freshly grated }
                                            - { amount: 213 g (7-1/2 oz.; 1 cup), ingredient: dark brown sugar }
                                            - { amount: 50 g (1-3/4 oz.; 1/4 cup), ingredient: granulated sugar }
                                            - { amount: 2 tsp., ingredient: vanilla extract }
                                        - { amount: 2 large, ingredient: eggs }
                                    - step: whisk
                                      inputs:
                                        - { amount: 170 g (6 oz.; 1-1/3 cup), ingredient: all-purpose flour }
                                        - { amount: 1 tsp., ingredient: Diamond Crystal kosher salt, info: "For table salt, use half as much by volume." }
                                        - { amount: 1/2 tsp., ingredient: baking soda }
                                        - { amount: 1/2 tsp., ingredient: baking powder }
                                - { amount: 143 g (5 oz.; 1 cup), ingredient: raisins, info: "Dried chopped apricots, cherries or cranberries can stand in. Add up to 1 cup more mix-ins, such as chopped chocolate or nuts. If the fruit is very dry, soak it in hot water (or rum or bourbon) up to 10 min., then drain and pat dry." }
                                - step: cool on sheet 10 min.
                                  detail: turn oven off
                                  inputs:
                                    - step: 350°F for 10–15 min.
                                      detail: even layer on a rimmed sheet, stirring occasionally, until toasted and golden
                                      inputs:
                                        - { amount: 212 g (7-1/2 oz.; 2-1/2 cups), ingredient: rolled oats, info: "Don't swap in quick-cooking or steel-cut oats; they crumble or stay too firm." }
